# NOTE (2026-11-13): Certum SimplySign login sessions must not overlap
# across repos - concurrent sign jobs collide on the OTP session and fail
# after ~4 min of retries (the 2026-11-12 batch-push incident), and even
# sequential sign jobs need several minutes of cooldown (2026-11-13).
# Trigger signing repos one at a time, well spaced.
name: .NET CI/CD

# Package releases follow org decisions DevelApp-ai/DevelApp-Repo-Global#38
# and #73 (incl. the SHA-256 amendment, 2026-11-12). Main-branch pushes
# build+pack once, SIGN with Certum cloud code signing (SHA-256 fingerprint
# interface, identical on .NET 9/.NET 10 SDKs, no SDK pin), then publish in
# the fixed #73 order - GitHub Packages -> GitHub Release -> NuGet.org - with
# loud failures (no continue-on-error on the NuGet.org push; it is last so it
# can never block the org feed or the release). Prereleases (semVer with '-')
# go to GitHub Packages only, never to NuGet.org. PR builds never sign.

# Triggers the workflow on pushes to main branch and pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write          # Required for creating releases and pushing tags
  packages: write          # Required for publishing to GitHub Packages
  pull-requests: write     # Required for PR comments
  issues: write           # Required for issue comments
  actions: read           # Required for workflow access

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Fetches all history for GitVersion

    - name: Install GitVersion
      # Pinned to 5.12.0: GitVersion 6.x mis-translates the legacy
      # GitVersion.yml (mode: ContinuousDelivery, tag: '') into a PRERELEASE
      # semVer on main, which correctly gates the GitHub Release and the
      # NuGet.org push off per org decision #73 - so nothing ever reaches
      # nuget.org (2026-11-13 incident). 5.12.0 + useConfigFile computes the
      # intended stable versions (proven setup in CognitiveGraph).
      # NOTE: GitVersion 5.x also needs the @v0 action major - the v4.x
      # gitversion action enforces >=6.2.0 <7.0.0 (PR #85 CI failure,
      # 2026-11-13).
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.12.0'

    - name: Determine Version
      id: gitversion # The output of this step is used later
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true # load the legacy GitVersion.yml (5.x semantics)

    - name: Display GitVersion outputs
      run: |
        echo "Major: ${{ steps.gitversion.outputs.major }}"
        echo "Minor: ${{ steps.gitversion.outputs.minor }}"
        echo "Patch: ${{ steps.gitversion.outputs.patch }}"
        echo "PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"
        echo "PreReleaseTagWithDash: ${{ steps.gitversion.outputs.preReleaseTagWithDash }}"
        echo "PreReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}"
        echo "PreReleaseNumber: ${{ steps.gitversion.outputs.preReleaseNumber }}"
        echo "WeightedPreReleaseNumber: ${{ steps.gitversion.outputs.weightedPreReleaseNumber }}"
        echo "BuildMetaData: ${{ steps.gitversion.outputs.buildMetaData }}"
        echo "BuildMetaDataPadded: ${{ steps.gitversion.outputs.buildMetaDataPadded }}"
        echo "FullBuildMetaData: ${{ steps.gitversion.outputs.fullBuildMetaData }}"
        echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
        echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
        echo "LegacySemVer: ${{ steps.gitversion.outputs.legacySemVer }}"
        echo "LegacySemVerPadded: ${{ steps.gitversion.outputs.legacySemVerPadded }}"
        echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
        echo "AssemblySemFileVer: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
        echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
        echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
        echo "BranchName: ${{ steps.gitversion.outputs.branchName }}"
        echo "EscapedBranchName: ${{ steps.gitversion.outputs.escapedBranchName }}"
        echo "Sha: ${{ steps.gitversion.outputs.sha }}"
        echo "ShortSha: ${{ steps.gitversion.outputs.shortSha }}"
        echo "NuGetVersionV2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"
        echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}"
        echo "NuGetPreReleaseTagV2: ${{ steps.gitversion.outputs.nuGetPreReleaseTagV2 }}"
        echo "NuGetPreReleaseTag: ${{ steps.gitversion.outputs.nuGetPreReleaseTag }}"
        echo "VersionSourceSha: ${{ steps.gitversion.outputs.versionSourceSha }}"
        echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"
        echo "CommitsSinceVersionSourcePadded: ${{ steps.gitversion.outputs.commitsSinceVersionSourcePadded }}"
        echo "UncommittedChanges: ${{ steps.gitversion.outputs.uncommittedChanges }}"
        echo "CommitDate: ${{ steps.gitversion.outputs.commitDate }}"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      # Use the version calculated by GitVersion
      run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

    - name: Verify formatting
      run: dotnet format --verify-no-changes

    - name: Test with coverage
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" /p:CoverletOutputFormat=cobertura

    - name: Generate coverage report
      if: always()
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.4 || true
        reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:Cobertura\;HtmlSummary -assemblyfilters:"+MarkdownStructureChunker;-*Tests*"

    - name: Enforce minimum line coverage
      # Prevent silent coverage regressions. Threshold starts low and can be raised as coverage improves.
      run: |
        RATE=$(grep -oE 'line-rate="[0-9]+(\.[0-9]+)?"' coverage-report/Cobertura.xml | head -1 | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
        awk -v rate="$RATE" -v thresh=40 'BEGIN{pct=rate*100; printf "Line coverage: %.2f%%\n", pct; if (pct+0 < thresh+0){printf "::error::Line coverage %.2f%% is below the required %d%% threshold.\n", pct, thresh; exit 1} exit 0}'
      shell: bash

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report
        path: coverage-report/**
        if-no-files-found: warn

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: |
          **/TestResults/**/*
          **/coverage/**/*
        if-no-files-found: warn

    - name: Pack
      # Creates the NuGet package using the calculated version
      run: dotnet pack ./Core/Core.csproj --no-build --configuration Release -o ./artifacts /p:PackageVersion=${{ steps.gitversion.outputs.semVer }} /p:Version=${{ steps.gitversion.outputs.semVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

    - name: Validate package consumption
      run: |
        SAMPLE_DIR="${RUNNER_TEMP}/package-consumption-sample"
        rm -rf "$SAMPLE_DIR"
        mkdir -p "$SAMPLE_DIR"
        cd "$SAMPLE_DIR"

        dotnet new console --framework net8.0 --force
        dotnet add package MarkdownStructureChunker --version "${{ steps.gitversion.outputs.semVer }}" --source "${GITHUB_WORKSPACE}/artifacts"

        cat > Program.cs <<'EOF'
        using MarkdownStructureChunker.Core;
        using System.Linq;

        using var chunker = StructureChunker.CreateStructureFirst();
        var chunks = await chunker.ChunkAsync("# Sample\nThis is package validation content.");
        Console.WriteLine(chunks.Count());
        EOF

        dotnet build --configuration Release
        dotnet run --configuration Release --no-build

    - name: Upload package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages-unsigned
        path: artifacts/*.nupkg
        if-no-files-found: error

    - name: Upload symbol packages
      uses: actions/upload-artifact@v7
      with:
        name: symbol-packages
        path: artifacts/*.snupkg
        if-no-files-found: error

  sign:
    name: Sign NuGet Package (Certum cloud)
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download package
      uses: actions/download-artifact@v7
      with:
        name: nuget-packages-unsigned
        path: packages/

    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT','CERTUM_FINGERPRINT_SHA256')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $fp = $env:CERTUM_FINGERPRINT_SHA256 -replace '\s',''
        if ($fp -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Certificate fingerprint must be exactly 64 hex characters (CODE_SIGNING_CERT_FINGERPRINT_SHA256 org secret, decision #73 amendment).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }

    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; proven by the LocalTaskhandler signing
      # test (run 43089090840, 2026-11-11). Never sees
      # CERTUM_SIMPLYSIGN_PASSWORD - that secret stays dormant.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'

    - name: Sign NuGet package
      # SHA-256 fingerprint interface (decision #73 amendment, 2026-11-12):
      # works identically on .NET 9 and .NET 10 SDKs; no SDK pin needed.
      # Symbol packages (.snupkg) are not signed - only .nupkg files are.
      shell: pwsh
      env:
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        $fp = ($env:CERTUM_FINGERPRINT_SHA256 -replace '\s','').ToUpperInvariant()
        $packages = @(Get-ChildItem packages/*.nupkg)
        if (-not $packages.Count) { throw 'No package found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-fingerprint $fp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Verify signature (gate)
      # Any invalid signature fails the job and blocks publishing.
      shell: pwsh
      run: |
        foreach ($p in @(Get-ChildItem packages/*.nupkg)) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Upload signed package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages-signed
        path: packages/*.nupkg
        if-no-files-found: error

  publish:
    name: Publish (GitHub Packages -> Release -> NuGet.org)
    needs: [build, sign]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # release creation
      packages: write # GitHub Packages
      id-token: write # OIDC token issuance for NuGet trusted publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Fetches all history for GitVersion (same commit -> same version as the build job)

    - name: Install GitVersion
      # Pinned to 5.12.0: GitVersion 6.x mis-translates the legacy
      # GitVersion.yml (mode: ContinuousDelivery, tag: '') into a PRERELEASE
      # semVer on main, which correctly gates the GitHub Release and the
      # NuGet.org push off per org decision #73 - so nothing ever reaches
      # nuget.org (2026-11-13 incident). 5.12.0 + useConfigFile computes the
      # intended stable versions (proven setup in CognitiveGraph).
      # NOTE: GitVersion 5.x also needs the @v0 action major - the v4.x
      # gitversion action enforces >=6.2.0 <7.0.0 (PR #85 CI failure,
      # 2026-11-13).
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.12.0'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true # same version as the build job

    - name: Download signed packages
      uses: actions/download-artifact@v7
      with:
        name: nuget-packages-signed
        path: artifacts/

    - name: Download symbol packages
      uses: actions/download-artifact@v7
      with:
        name: symbol-packages
        path: artifacts/

    # Publishing order per org decision #73: GitHub Packages first, GitHub
    # Release second, NuGet.org last. The NuGet.org push is never
    # continue-on-error - a failure is a visible red job. Prerelease versions
    # (semVer contains '-') are published to GitHub Packages only, never to
    # NuGet.org or as a stable GitHub Release.
    - name: Publish to GitHub Packages
      run: |
        dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
        dotnet nuget push ./artifacts/*.nupkg --source "github" --skip-duplicate
        dotnet nuget push ./artifacts/*.snupkg --source "github" --skip-duplicate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release
      if: ${{ !contains(steps.gitversion.outputs.semVer, '-') }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.gitversion.outputs.semVer }}
        name: Release v${{ steps.gitversion.outputs.semVer }}
        body: |
          ## MarkdownStructureChunker v${{ steps.gitversion.outputs.semVer }}

          Signed NuGet package (Certum cloud signing, org decisions
          DevelApp-Repo-Global#38 + #73). Published to GitHub Packages and
          NuGet.org in the #73 order.

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.gitversion.outputs.semVer }}
        draft: false
        prerelease: false
        files: |
          ./artifacts/MarkdownStructureChunker.${{ steps.gitversion.outputs.semVer }}.nupkg
          ./artifacts/MarkdownStructureChunker.${{ steps.gitversion.outputs.semVer }}.snupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: NuGet.org login (OIDC -> temp API key)
      # Trusted publishing (org standard; the long-lived NUGET_API_KEY secret is
      # gone): this job's GitHub OIDC token is exchanged for a ~1-hour nuget.org
      # API key, validated against the trusted publishing policy registered on
      # nuget.org for this repository + workflow:
      #   Repository Owner: DevelApp-ai
      #   Repository:      MarkdownStructureChunker
      #   Workflow File:   dotnet.yml
      #   Environment:     (none - this job uses no environment)
      # NUGET_USER = the nuget.org profile name of the owning account (NOT an
      # email address). The login runs close to the push (the temp key is
      # short-lived). Fails loudly if the policy is not (yet) registered.
      id: nuget-login
      if: ${{ !contains(steps.gitversion.outputs.semVer, '-') }}
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet.org (stable releases only)
      if: ${{ !contains(steps.gitversion.outputs.semVer, '-') }}
      run: |
        echo "Publishing stable release packages to NuGet.org..."
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

        echo "Publishing symbol packages to NuGet.org..."
        dotnet nuget push ./artifacts/*.snupkg \
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
